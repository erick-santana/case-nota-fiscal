name: CI

on:
  push:        { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build e testes
        run: ./mvnw -B clean verify
      - name: Verificar ausência de segredo em properties
        run: |
          ! grep -rEn 'amazonaws\.com|arn:aws:|AKIA[0-9A-Z]{16}' src/main/resources/application*.properties
      - name: Definir chave semanal do cache do Trivy
        id: trivy-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-week.outputs.week }}
          restore-keys: trivy-db-
      - name: Trivy — CVEs nas dependências (SCA)
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v "$PWD":/repo -v "$HOME/.m2":/root/.m2:ro -v "$HOME/.cache/trivy":/root/.cache/trivy \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 /repo
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: surefire-reports, path: target/surefire-reports/, retention-days: 7 }

  build-image:
    name: Build da imagem (Paketo buildpacks)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build da imagem
        run: >
          ./mvnw -B -DskipTests spring-boot:build-image
          -Dspring-boot.build-image.imageName=geradornotafiscal:${{ github.sha }}
      - name: Definir chave semanal do cache do Trivy
        id: trivy-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-week.outputs.week }}
          restore-keys: trivy-db-
      - name: Trivy — CVEs na imagem do contêiner
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy":/root/.cache/trivy \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            geradornotafiscal:${{ github.sha }}
      - name: Smoke test — readiness do contêiner
        run: |
          docker run -d --name smoke -p 8080:8080 -p 8081:8081 \
            -e SPRING_PROFILES_ACTIVE=local geradornotafiscal:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/actuator/health/readiness | grep -q '"UP"'; then
              echo "readiness OK"; docker rm -f smoke; exit 0
            fi
            sleep 2
          done
          echo "Aplicação não ficou pronta no tempo esperado"; docker logs smoke; docker rm -f smoke; exit 1
