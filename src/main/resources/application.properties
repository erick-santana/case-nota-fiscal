spring.application.name=geradornotafiscal
spring.profiles.default=local

server.port=${SERVER_PORT:8080}
management.server.port=${MANAGEMENT_PORT:8081}

management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.structured.format.console=logstash

# SPEC-07 — outbox transacional no DynamoDB (ADR-0001). endpoint-override vazio = resolucao
# padrao AWS (dev/staging/prod, via task role do ECS); perfil local aponta para o DynamoDB
# Local do docker-compose (sem credencial real, P4). A publicacao no Kafka a partir daqui e
# feita por uma Lambda que ouve o DynamoDB Streams desta tabela, fora deste servico.
app.outbox.dynamodb.table-name=${DYNAMODB_TABLE_NAME:nota_fiscal_processamento}
app.outbox.dynamodb.region=${AWS_REGION:us-east-1}
app.outbox.dynamodb.endpoint-override=${DYNAMODB_ENDPOINT_OVERRIDE:}
app.outbox.dynamodb.auto-create-table=${DYNAMODB_AUTO_CREATE_TABLE:false}
