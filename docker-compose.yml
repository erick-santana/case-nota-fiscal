services:
  geradornotafiscal:
    image: geradornotafiscal:${APP_VERSION:-0.0.1-SNAPSHOT}
    env_file: [.env]
    environment:
      # SPEC-07: dentro da rede do compose, o DynamoDB Local é alcançado pelo nome do serviço,
      # não por localhost. Sem credencial AWS real (P4) — DynamoDB Local aceita qualquer valor.
      DYNAMODB_ENDPOINT_OVERRIDE: http://dynamodb-local:8000
      DYNAMODB_AUTO_CREATE_TABLE: "true"
    depends_on:
      - dynamodb-local
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "${MANAGEMENT_PORT:-8081}:8081"
    healthcheck:
      # A imagem Paketo jammy-base não traz curl/wget; /dev/tcp do bash faz o GET sem depender de nenhum utilitário extra.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8081 &&
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q 200
      interval: 10s
      retries: 6

  # SPEC-07 — outbox transacional local, sem AWS real (P4). A publicação no Kafka a partir do
  # DynamoDB Streams desta tabela é feita por uma Lambda fora deste repositório (RFC-0001).
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["8000:8000"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      - geradornotafiscal

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on:
      - prometheus
